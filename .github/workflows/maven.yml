# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven (REST-assured & Selenium)

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test scenario tags'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (REST-assured)
        run: mvn test --file ./atg-api/pom.xml

      - name: Copy results to root target folder
        if: always()
        run: mkdir -p target/allure-results && cp -r atg-api/target/allure-results/. target/allure-results

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome
        run: google-chrome --version

      - name: Build with Maven (Selenium)
        run: xvfb-run --auto-servernum mvn test --file ./atg-selenium/pom.xml

      - name: Copy results to root target folder
        if: always()
        run: mkdir -p target/allure-results && cp -r atg-selenium/target/allure-results/. target/allure-results

      - name: Upload Selenium failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots-${{ github.run_number }}
          path: atg-selenium/target/failure-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Allure CLI
        if: always()
        env:
          ALLURE_VERSION: 2.44.0
        run: |
          curl --fail --location --retry 3 \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz" \
            --output "$RUNNER_TEMP/allure-commandline.tgz"
          tar -xzf "$RUNNER_TEMP/allure-commandline.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build test report
        if: always()
        env:
          ALLURE_REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          results_dir=target/allure-results
          history_dir=allure-history
          run_report_dir="${history_dir}/${GITHUB_RUN_NUMBER}"

          mkdir -p "$results_dir" "$history_dir"
          if [ -d gh-pages ]; then
            cp -a gh-pages/. "$history_dir/"
          fi
          if [ -d "${history_dir}/last-history" ]; then
            mkdir -p "${results_dir}/history"
            cp -a "${history_dir}/last-history/." "${results_dir}/history/"
          fi

          cat > "${results_dir}/executor.json" <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Allure Report with history",
            "url": "${ALLURE_REPORT_URL}",
            "reportUrl": "${ALLURE_REPORT_URL}/${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "buildName": "GitHub Actions Run #${GITHUB_RUN_ID}",
            "buildOrder": "${GITHUB_RUN_NUMBER}"
          }
          EOF

          allure generate --clean "$results_dir" -o "$run_report_dir"
          mkdir -p "${history_dir}/last-history"
          cp -a "${run_report_dir}/history/." "${history_dir}/last-history/"
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; URL=%s/%s/index.html">\n<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">\n' \
            "$ALLURE_REPORT_URL" "$GITHUB_RUN_NUMBER" > "${history_dir}/index.html"

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
